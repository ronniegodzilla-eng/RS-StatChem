<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF5350"/>
      <stop offset="0.55" stop-color="#D32F2F"/>
      <stop offset="1" stop-color="#9E1B1B"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E53935"/>
      <stop offset="1" stop-color="#A31515"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <!-- Name plate -->
  <rect x="30" y="78" width="430" height="176" rx="10" fill="#FFFFFF" stroke="#C62828" stroke-width="8"/>
  <rect x="42" y="90" width="406" height="152" rx="5" fill="none" stroke="#E57373" stroke-width="2"/>
  <text x="62" y="222" font-family="Georgia" font-weight="bold" font-style="italic" font-size="156"
        fill="url(#red)" stroke="#8E1B1B" stroke-width="2.5">RS</text>

  <!-- Banner -->
  <rect x="30" y="262" width="430" height="58" rx="4" fill="url(#banner)"/>
  <text x="56" y="304" font-family="Georgia" font-weight="bold" font-style="italic" font-size="40"
        fill="#FFFFFF">StatChem</text>

  <!-- Emblem -->
  <circle cx="555" cy="185" r="150" fill="#FFFFFF" stroke="#A4161A" stroke-width="14"/>
  <circle cx="555" cy="185" r="137" fill="none" stroke="#EF9A9A" stroke-width="2.5"/>

  <!-- Benzene ring with bar chart -->
  <polygon points="555,173 608.7,204 608.7,266 555,297 501.3,266 501.3,204"
           fill="none" stroke="#C62828" stroke-width="8" stroke-linejoin="round"/>
  <rect x="524" y="242" width="15" height="28" fill="#C62828"/>
  <rect x="547.5" y="224" width="15" height="46" fill="#D32F2F"/>
  <rect x="571" y="206" width="15" height="64" fill="#8E1B1B"/>

  <!-- Mortarboard -->
  <path d="M505,118 L510,160 Q570,185 630,160 L635,118 Z" fill="#141414"/>
  <polygon points="465,100 570,62 675,100 570,138" fill="url(#cap)"/>
  <polyline points="570,100 660,108 662,168" fill="none" stroke="#4FC3F7" stroke-width="3"/>
  <circle cx="570" cy="100" r="5" fill="#4FC3F7"/>
  <path d="M655,166 L669,166 L674,212 L650,212 Z" fill="#C2185B"/>
  <rect x="654" y="170" width="16" height="4" fill="#4FC3F7"/>
</svg>
