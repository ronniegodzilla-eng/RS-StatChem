name: Diagnose test teardown

# Temporary: run every test file in its own process, without the forced exit in
# tests/conftest.py, to find which tests leave Qt (or other native) state that crashes on exit.
on:
  workflow_dispatch:

jobs:
  per-file:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Each test file in its own process
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          RS_TEST_NATURAL_EXIT: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          summary=""
          for f in tests/test_*.py; do
            echo "::group::$f"
            python -X faulthandler -m pytest -q -p no:cacheprovider "$f" 2>&1 | tail -40
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            summary="$summary\n$code  $f"
          done
          echo "===== exit code per test file ====="
          printf "$summary\n"
      - name: Import-only checks
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          for m in rsstatchem.ui.data_editor rsstatchem.ui.graph rsstatchem.ui.chem_editor rsstatchem.ui.dialogs.doe; do
            python -X faulthandler -c "import $m" ; echo "import $m -> $?"
          done
          python -X faulthandler -c "from PySide6.QtWidgets import QApplication; app = QApplication([])" ; echo "bare QApplication -> $?"
          python -X faulthandler -c "from PySide6.QtWidgets import QApplication; from rsstatchem.app import AppContext; app = QApplication([]); ctx = AppContext(app); ed = ctx.new_editor()" ; echo "AppContext + editor -> $?"
