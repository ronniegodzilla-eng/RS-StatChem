name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach the zips to the GitHub Release created for a v* tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon runner -> native arm64 .app
            artifact: RS-StatChem-macOS-arm64
          - os: windows-latest
            artifact: RS-StatChem-Windows-x64-portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        shell: bash
        run: |
          set +e
          python -m pytest -q tests
          code=$?
          echo "pytest process exit code: $code"
          exit $code

      - name: Build
        run: pyinstaller packaging/rsstatchem.spec --noconfirm --clean

      - name: Smoke-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: dist/RS-StatChem.app/Contents/MacOS/RS-StatChem --selftest

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/RS-StatChem/RS-StatChem.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/RS-StatChem.app "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/PORTABLE-README.txt dist/RS-StatChem/README.txt
          Compress-Archive -Path dist/RS-StatChem -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
