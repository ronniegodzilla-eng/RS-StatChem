name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach the zips to the GitHub Release created for a v* tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon runner -> native arm64 .app
            artifact: RS-StatChem-macOS-arm64
          - os: windows-latest
            artifact: RS-StatChem-Windows-x64-portable
    runs-on: ${{ matrix.os }}
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # OPSIN (offline name -> structure, MIT) and the CDK logP helper (LGPL) run on Java: a
      # pinned Temurin JDK provides javac (CDK helper) and jlink, which builds a small runtime
      # (java.base + java.xml, enough for both) for the bundle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch OPSIN and CDK, build the CDK helper and a minimal Java runtime
        shell: bash
        run: |
          python scripts/fetch_opsin.py
          python scripts/fetch_cdk.py
          rm -rf build-jre
          jlink --add-modules "$(python scripts/fetch_opsin.py --print-modules),$(python scripts/fetch_cdk.py --print-modules)" \
                --strip-debug --no-man-pages --no-header-files --compress=zip-9 \
                --output build-jre/jre
          du -sh build-jre/jre rsstatchem/resources/opsin/opsin-cli.jar rsstatchem/resources/java
          printf '2-acetoxybenzoic acid\n' | build-jre/jre/bin/java \
            -Dlog4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory \
            -jar rsstatchem/resources/opsin/opsin-cli.jar -osmi
          python scripts/fetch_cdk.py --check-runtime build-jre/jre/bin/java

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          python -m pytest -q tests
          code=$?
          echo "pytest process exit code: $code"
          exit $code

      - name: Build
        run: python -m PyInstaller packaging/rsstatchem.spec --noconfirm --clean

      # Indigo (optional atom mapping, from requirements.txt) loads its native library with
      # ctypes; the spec collects it, this fails the build if it went missing
      - name: Check the bundled Indigo library
        shell: bash
        run: |
          python -c "import indigo; print('Indigo', indigo.Indigo().version())"
          found="$(find dist -path '*indigo/lib/*' \( -name 'libindigo.dylib' -o -name 'indigo.dll' \) | head -1)"
          test -n "$found" || { echo "Indigo library missing from the bundle"; exit 1; }
          du -h "$found"

      - name: Bundle the Java runtime for OPSIN (macOS)
        if: runner.os == 'macOS'
        run: |
          RES="$(cd dist/RS-StatChem.app/Contents/Frameworks/rsstatchem/resources && pwd -P)"
          test -f "$RES/opsin/opsin-cli.jar"
          test -f "$RES/java/rsstatchem-cdk.jar" && test -f "$RES/java/cdk-classpath.txt"
          while read -r jar; do test -f "$RES/java/$jar" || { echo "missing $jar"; exit 1; }; done < "$RES/java/cdk-classpath.txt"
          cp -R build-jre/jre "$RES/opsin/jre"
          # re-seal the ad-hoc signature over the added files (Temurin's binaries keep their
          # own signatures; sign them ad hoc only if the bundle cannot be sealed otherwise)
          if ! codesign --force --deep --sign - dist/RS-StatChem.app; then
            find "$RES/opsin/jre" -type f \( -name '*.dylib' -o -perm -u+x \) \
              -exec codesign --force --sign - {} \;
            codesign --force --deep --sign - dist/RS-StatChem.app
          fi
          du -sh "$RES/opsin/jre" "$RES/opsin/opsin-cli.jar" "$RES/java" dist/RS-StatChem.app

      - name: Bundle the Java runtime for OPSIN (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $res = "dist/RS-StatChem/_internal/rsstatchem/resources"
          if (-not (Test-Path "$res/opsin/opsin-cli.jar")) { throw "OPSIN jar missing from the build" }
          if (-not (Test-Path "$res/java/rsstatchem-cdk.jar")) { throw "CDK helper missing from the build" }
          if (-not (Test-Path "$res/java/cdk-classpath.txt")) { throw "CDK class path missing from the build" }
          foreach ($jar in Get-Content "$res/java/cdk-classpath.txt") {
            if ($jar -and -not (Test-Path "$res/java/$jar")) { throw "CDK jar $jar missing from the build" }
          }
          Copy-Item -Recurse build-jre/jre "$res/opsin/jre"
          "{0:N1} MB Java runtime" -f ((Get-ChildItem "$res/opsin/jre" -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke-test the packaged app (macOS)
        if: runner.os == 'macOS'
        env:
          RSSTATCHEM_SELFTEST_OPSIN: bundled   # name -> structure must work with the bundled Java
          RSSTATCHEM_SELFTEST_CDK: bundled     # CDK logP must work with the bundled Java
        run: |
          dist/RS-StatChem.app/Contents/MacOS/RS-StatChem --selftest
          # HTTPS from the packaged app (certifi bundle): any HTTP answer proves TLS works; the
          # shared runners often hit GitHub's anonymous API rate limit (HTTP 403/429)
          out="$(dist/RS-StatChem.app/Contents/MacOS/RS-StatChem --check-update --update-url=https://api.github.com/repos/cli/cli/releases/latest)" && code=0 || code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && ! grep -q "GitHub answered HTTP" <<<"$out"; then exit "$code"; fi

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RSSTATCHEM_SELFTEST_OPSIN: bundled   # name -> structure must work with the bundled Java
          RSSTATCHEM_SELFTEST_CDK: bundled     # CDK logP must work with the bundled Java
        run: |
          $p = Start-Process dist/RS-StatChem/RS-StatChem.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/RS-StatChem.app "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/PORTABLE-README.txt dist/RS-StatChem/README.txt
          Compress-Archive -Path dist/RS-StatChem -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip

      # The source repository is private, so the app checks for updates against a public
      # mirror that only holds the release zips and notes (needs the RELEASES_TOKEN secret).
      - name: Release notes for the public mirror
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASES_TOKEN == 'true'
        shell: bash
        run: |
          git log -1 --pretty=%B | grep -v '^Co-Authored-By:' > release-notes.md
          echo "" >> release-notes.md
          echo "Install: unzip, then replace RS-StatChem (macOS: in Applications; Windows: the portable folder)." >> release-notes.md

      - name: Publish to the public releases repository
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ronniegodzilla-eng/RS-StatChem-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: RS-StatChem ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ matrix.artifact }}.zip
